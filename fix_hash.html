<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Fix hashSalt - PapusBank</title>
<style>
  body { background: #0a0a0f; color: #fff; font-family: 'Orbitron', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
  .box { background: rgba(255,255,255,0.05); border: 1px solid rgba(0,212,255,0.3); border-radius: 16px; padding: 40px; max-width: 500px; width: 90%; }
  h2 { color: #00d4ff; text-align: center; margin-bottom: 20px; }
  input { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: #fff; font-size: 14px; box-sizing: border-box; }
  button { width: 100%; padding: 14px; border-radius: 8px; border: none; background: linear-gradient(135deg, #00ffaa, #00d4ff); color: #000; font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; }
  button:hover { opacity: 0.9; }
  #result { margin-top: 16px; text-align: center; font-size: 13px; min-height: 20px; }
  label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="box">
  <h2>FIX hashSalt</h2>
  <label>Nick (nuevo nombre)</label>
  <input id="nick" placeholder="Ej: solariswat">
  <label>Hash Salt (nick original con el que se registró)</label>
  <input id="salt" placeholder="Ej: emilio">
  <button onclick="fixIt()">FIX</button>
  <div id="result"></div>
  <p style="font-size:10px;color:#555;text-align:center;margin-top:20px;">Borra este archivo después de usarlo</p>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js';
  import { getFirestore, doc, getDoc, updateDoc } from 'https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "AIzaSyBiFh_LL0wOE31sfhslB5RlGNhBNDhR8Pw",
    authDomain: "los-papus-nivel-dios.firebaseapp.com",
    projectId: "los-papus-nivel-dios",
    storageBucket: "los-papus-nivel-dios.appspot.com",
    messagingSenderId: "440148979897",
    appId: "1:440148979897:web:7ff95f28fdabe1f1d44bb1"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.fixIt = async function() {
    const nick = document.getElementById('nick').value.trim().toLowerCase();
    const salt = document.getElementById('salt').value.trim().toLowerCase();
    const result = document.getElementById('result');

    if (!nick || !salt) { result.innerHTML = '<span style="color:#ff4466">Completa ambos campos</span>'; return; }

    try {
      const ref = doc(db, 'users', nick);
      const snap = await getDoc(ref);
      if (!snap.exists()) { result.innerHTML = '<span style="color:#ff4466">Usuario "' + nick + '" no encontrado</span>'; return; }

      await updateDoc(ref, { hashSalt: salt });
      result.innerHTML = '<span style="color:#00ffaa">FIX APLICADO: hashSalt = "' + salt + '" para "' + nick + '"</span><br><span style="color:#888;font-size:11px;">Ahora prueba loguearte con tu contraseña original</span>';
    } catch(e) {
      result.innerHTML = '<span style="color:#ff4466">Error: ' + e.message + '</span>';
    }
  };
</script>
</body>
</html>
